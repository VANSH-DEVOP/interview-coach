[project]
name = "interviewpilot-backend"
version = "0.1.0"
description = "InterviewPilot AI - Application layer (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "chromadb>=0.5",
    "numpy>=1.24",
    "arq>=0.26",
    "aiosmtplib>=3.0",
    # Tracing only. Deliberately the SDK on its own, not LangChain: its
    # @traceable decorator works on plain functions, so the pipeline is traced
    # as written rather than rewritten to be traceable.
    "langsmith>=0.10",
    # The provider transport only. Not `langchain` itself: this pulls in
    # langchain-core and the Google integration, and nothing above the client
    # seam knows either exists. Adopted because Google has retired a model ID
    # under this project twice, and an integration package absorbs that class
    # of change instead of it being ours to find.
    "langchain-google-genai>=4.0",
    # The vector store transport. Still not `langchain` itself -- this is a
    # single package on top of chromadb, where `EnsembleRetriever` would have
    # pulled in langgraph and three of its packages to replace forty tested
    # lines of rank fusion. Fusion, the distance cutoff and the retrieval
    # metrics stay ours; see app/services/ai/vector_store.py for why the
    # embeddings do too.
    "langchain-chroma>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Linters are pinned, unlike the runtime dependencies. A new ruff or mypy
    # adds rules, so an unpinned range means CI enforces something a developer's
    # machine does not -- which is exactly how this pipeline first failed
    # (local ruff 0.15 vs CI 0.16, which promoted import sorting to a default).
    "ruff==0.16.2",
    "mypy==2.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot silently change what is enforced.
#   E4/E7/E9, F -- pycodestyle and pyflakes (ruff's historical default)
#   I           -- import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
