[project]
name = "interviewpilot-backend"
version = "0.1.0"
description = "InterviewPilot AI - Application layer (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    # >=2.14.2 for GHSA-4xgf-cpjx-pc3j (secrets_dir symlink escape). Not
    # reachable here -- settings come from the environment, not secrets_dir --
    # but the fix is a patch bump, so there is nothing to weigh.
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # >=6.15.0 for PYSEC-2026-3655 and -3656: a crafted PDF causes large memory
    # consumption and long runtimes *during text extraction*. This is the one
    # advisory in this file that is directly reachable -- ResumeParser.parse
    # runs exactly that path on a file any registered user can upload.
    "pypdf>=6.15.0",
    "python-docx>=1.0",
    "chromadb>=0.5",
    "numpy>=1.24",
    "arq>=0.26",
    "aiosmtplib>=3.0",
    # Tracing only. Deliberately the SDK on its own, not LangChain: its
    # @traceable decorator works on plain functions, so the pipeline is traced
    # as written rather than rewritten to be traceable.
    "langsmith>=0.10",
    # The provider transport only. Not `langchain` itself: this pulls in
    # langchain-core and the Google integration, and nothing above the client
    # seam knows either exists. Adopted because Google has retired a model ID
    # under this project twice, and an integration package absorbs that class
    # of change instead of it being ours to find.
    "langchain-google-genai>=4.0",
    # The vector store transport. Still not `langchain` itself -- this is a
    # single package on top of chromadb, where `EnsembleRetriever` would have
    # pulled in langgraph and three of its packages to replace forty tested
    # lines of rank fusion. Fusion, the distance cutoff and the retrieval
    # metrics stay ours; see app/services/ai/vector_store.py for why the
    # embeddings do too.
    "langchain-chroma>=1.1",
    # Error reporting. Off until SENTRY_DSN is set, and scrubbed hard when on:
    # the locals at a crash here are the prompt, the resume and the transcript.
    "sentry-sdk[fastapi]>=2.0",
    # S3-compatible object storage (AWS S3, Cloudflare R2, MinIO, B2 -- one
    # client for all of them). Imported only when STORAGE_BACKEND=s3.
    #
    # boto3 rather than aioboto3: aiobotocore pins botocore narrowly and is a
    # common source of resolver conflicts, and the calls here are already
    # offloaded with asyncio.to_thread, the way local.py handles file I/O.
    "boto3>=1.34",
]

[project.optional-dependencies]
# Chat providers, one package each. Optional because a deployment runs one of
# them: AI_PROVIDER=gemini is the default and needs nothing extra.
#
# `openai` covers more than OpenAI -- Groq, Ollama, OpenRouter, Together and
# vLLM all speak that API, and are reached with AI_BASE_URL rather than another
# package. Ollama in particular makes a fully local, zero-cost provider a
# `pip install` and one setting away.
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Linters are pinned, unlike the runtime dependencies. A new ruff or mypy
    # adds rules, so an unpinned range means CI enforces something a developer's
    # machine does not -- which is exactly how this pipeline first failed
    # (local ruff 0.15 vs CI 0.16, which promoted import sorting to a default).
    "ruff==0.16.2",
    "mypy==2.3.0",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot silently change what is enforced.
#   E4/E7/E9, F -- pycodestyle and pyflakes (ruff's historical default)
#   I           -- import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# boto3 and botocore ship no type information and no py.typed marker, so mypy
# cannot see into them. Narrowed to those two modules rather than set globally:
# `ignore_missing_imports = true` at the top level would also silence a genuine
# typo in one of our own imports, which is most of what this catches.
#
# Deliberately not `boto3-stubs`: the client is held as `Any` behind the
# StorageService interface anyway -- callers never touch it -- so the stubs
# would add a large dependency to type four calls.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# Optional provider extras. Not installed by default -- a Gemini deployment
# should not carry the Anthropic and OpenAI SDKs -- so mypy cannot see them.
# `providers.py` imports each inside its own branch and turns the ImportError
# into a sentence naming the package to install, which is the behaviour these
# are meant to have.
[[tool.mypy.overrides]]
module = ["langchain_anthropic", "langchain_anthropic.*", "langchain_openai", "langchain_openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage is opt-in: `--cov` is deliberately NOT in addopts. Running one test
# file is the commonest thing a developer does, and measuring the whole
# application from it would report 8% and fail the threshold below every time.
# CI passes the flag explicitly; locally, `pytest --cov=app` reproduces it.

[tool.coverage.run]
source = ["app"]
# Branch coverage as well as line. Measured before switching it on: it moves
# the total from 92% to 91%, which is close to free, and it is the more
# meaningful number in a codebase whose defining feature is that every AI path
# has an `except` that silently swaps in a fallback. A fallback branch nothing
# ever takes is exactly what this project has shipped before.
branch = true

[tool.coverage.report]
show_missing = true
# The threshold is a ratchet against regression, not a target. Measured 91% at
# the time of writing, so this leaves roughly one point -- about 37 statements
# -- of slack, which exists for environment drift rather than for new untested
# code: CI runs Python 3.12 and developers here run 3.13, and coverage of
# version-conditional code differs between them.
#
# Raise it when the measured number rises. Never lower it to make a build pass:
# that converts the one signal this gives into a record of what was tolerated.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    # Never executed at runtime; exists for the type checker.
    "if TYPE_CHECKING:",
    # Bodies of abstract methods and Protocols -- there is nothing to cover.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # Script entry points; the suite imports these modules, it does not run them
    # as programs.
    "if __name__ == .__main__.:",
]
