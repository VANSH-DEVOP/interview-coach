name: interviewpilot

# The API and the evaluation worker are the same image and the same
# configuration, differing only in the command they run. Anchored so the two
# cannot drift -- a worker pointed at a different database or a different Gemini
# model would produce reports nobody could explain.
# Everything in the repository-root `.env` is passed to the backend and the
# worker, and the `environment:` block below then overrides the handful of values
# that must differ inside a container.
#
# This is an env_file rather than another thirty entries in that block, because
# the block was the bug: it listed sixteen variables, so SENTRY_DSN,
# LANGSMITH_*, METRICS_*, AI_PROVIDER, the quotas and the S3 settings could be
# set in `.env` and simply never reach the process. Nothing reported that --
# each of those features is off by default, so the symptom was a setting that
# appeared to do nothing.
#
# Compose gives `environment:` precedence over `env_file:`, which is what keeps
# POSTGRES_HOST, POSTGRES_PORT, REDIS_URL, CHROMA_PATH and STORAGE_LOCAL_PATH
# pointing at container addresses even though `.env` holds host-side values for
# the first two.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-true}
  # Container-to-container, so always the port Postgres listens on inside its
  # own network -- never the published one. POSTGRES_PORT in `.env` is the
  # host-side value and deliberately does not apply here.
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-interviewpilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewpilot}
  POSTGRES_DB: ${POSTGRES_DB:-interviewpilot}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-local-dev-key-override-me}
  CORS_ORIGINS: '["http://localhost:3000"]'
  REDIS_URL: redis://redis:6379
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/gemini-embedding-001}
  CHROMA_PATH: /var/lib/interviewpilot/chroma
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /var/lib/interviewpilot/storage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewpilot}
      POSTGRES_DB: ${POSTGRES_DB:-interviewpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewpilot} -d ${POSTGRES_DB:-interviewpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # One variable for the published port and for what a host-side process
      # (uvicorn, alembic, pytest run from a shell) connects to, so the two
      # cannot disagree. They previously did: compose published 5434 while
      # .env.example said 5433, which matched nothing at all.
      - "${POSTGRES_PORT:-5434}:5432"

  # Object storage for STORAGE_BACKEND=s3, and what the S3 tests run against.
  #
  # Behind a profile, so `docker compose up` does not start it: the default
  # backend is local disk and most work needs nothing here. Bring it up with
  #     docker compose --profile s3 up -d minio
  # It exists because MinIO speaks the same API as S3, R2 and B2, so the
  # provider can be developed and tested with no account, no card and no
  # network.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      # The web console, for looking at what was actually stored.
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Jobs are the only thing in here and the report row is the durable record,
    # so an AOF/RDB volume would buy very little: a restart drops the queue, and
    # the worker's reconciliation cron finds the reports that lost their job and
    # queues them again. The cost is the delay before that sweep notices, not
    # the work.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      # Resume blobs live OUTSIDE the application code, on a named volume.
      - resume_storage:/var/lib/interviewpilot/storage
      # The RAG index must survive restarts, or every resume needs re-uploading.
      - chroma_data:/var/lib/interviewpilot/chroma
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    # Same image, no HTTP server, no port. Overrides the image CMD to skip
    # `alembic upgrade head` -- two processes racing the same migration on
    # startup is a deadlock waiting to happen, and backend already runs it.
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    # `arq --check` exits non-zero when the heartbeat key is missing from Redis,
    # which is the same signal /health reports. Without it a dead worker is
    # invisible: the API keeps taking interviews and every report sits PENDING.
    # start_period covers the first write, one health_check_interval in.
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # No volumes: evaluation reads the transcript from Postgres and calls the
    # provider. It touches neither the resume blobs nor the vector store.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      # Server-side only, read by the BFF proxy. Deliberately different from
      # NEXT_PUBLIC_API_URL: that one is baked into the browser bundle and must
      # be an address the *browser* can reach, whereas this is one container
      # calling another, where `localhost` would mean the frontend itself.
      API_INTERNAL_URL: http://backend:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  minio_data:
  postgres_data:
  resume_storage:
  chroma_data:
