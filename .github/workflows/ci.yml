name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run; only the tip matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberately not a real key: the suite must pass without a provider, and a
  # test that quietly calls Gemini would be non-deterministic and would burn a
  # 20-requests/day quota.
  GEMINI_API_KEY: ""

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interviewpilot
          POSTGRES_PASSWORD: interviewpilot
          POSTGRES_DB: interviewpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interviewpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: interviewpilot
      POSTGRES_PASSWORD: interviewpilot
      POSTGRES_DB: interviewpilot
      # Writable paths for the storage and vector-store roots, whose defaults
      # point at /var/lib and are not writable for the runner user.
      STORAGE_LOCAL_PATH: ${{ github.workspace }}/.ci/storage
      CHROMA_PATH: ${{ github.workspace }}/.ci/chroma

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create writable data directories
        run: mkdir -p "$STORAGE_LOCAL_PATH" "$CHROMA_PATH"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Migrations apply
        run: alembic upgrade head

      - name: Migrations match the models
        # A model changed without a migration is otherwise only discovered when
        # a deploy fails or a query hits a column that does not exist.
        run: python scripts/check_migration_drift.py

      - name: Migrations reverse cleanly
        # A downgrade nobody runs is a downgrade that does not work. Ends back
        # at head so the tests below have a schema.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        # These turn the "no service, skip" paths into hard failures. Without
        # them, a broken Postgres or Redis container would silently skip every
        # test that needed it and still report a green build.
        env:
          REQUIRE_TEST_DATABASE: "1"
          REQUIRE_TEST_REDIS: "1"
        run: pytest -q --no-header -rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
