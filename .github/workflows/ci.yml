name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run; only the tip matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deliberately not a real key: the suite must pass without a provider, and a
  # test that quietly calls Gemini would be non-deterministic and would burn a
  # 20-requests/day quota.
  GEMINI_API_KEY: ""

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interviewpilot
          POSTGRES_PASSWORD: interviewpilot
          POSTGRES_DB: interviewpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interviewpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: interviewpilot
      POSTGRES_PASSWORD: interviewpilot
      POSTGRES_DB: interviewpilot
      # Writable paths for the storage and vector-store roots, whose defaults
      # point at /var/lib and are not writable for the runner user.
      STORAGE_LOCAL_PATH: ${{ github.workspace }}/.ci/storage
      CHROMA_PATH: ${{ github.workspace }}/.ci/chroma

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create writable data directories
        run: mkdir -p "$STORAGE_LOCAL_PATH" "$CHROMA_PATH"

      - name: Dependency audit
        # Fails on any known advisory in what is actually installed, which is
        # what ships in the image -- not on a lockfile nobody regenerates.
        #
        # PYSEC-2026-311 is ignored deliberately, with a reason and a condition
        # that would end it. It is a pre-authentication RCE in the ChromaDB
        # *server's* HTTP API (`/api/v2/.../collections`, via `trust_remote_code`).
        # This project embeds chromadb in-process through PersistentClient and
        # EphemeralClient and exposes no Chroma HTTP surface at all, so the
        # vulnerable endpoint does not exist here. There is no fixed version to
        # move to, so the alternatives were this or a permanently red build.
        #
        # REMOVE THIS IGNORE if app/services/ai/vector_store.py ever switches to
        # chromadb.HttpClient, or if a fixed chromadb is released.
        run: pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-311

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Migrations apply
        run: alembic upgrade head

      - name: Migrations match the models
        # A model changed without a migration is otherwise only discovered when
        # a deploy fails or a query hits a column that does not exist.
        run: python scripts/check_migration_drift.py

      - name: Migrations reverse cleanly
        # A downgrade nobody runs is a downgrade that does not work. Ends back
        # at head so the tests below have a schema.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        # These turn the "no service, skip" paths into hard failures. Without
        # them, a broken Postgres or Redis container would silently skip every
        # test that needed it and still report a green build.
        env:
          REQUIRE_TEST_DATABASE: "1"
          REQUIRE_TEST_REDIS: "1"
        # --cov is passed here rather than living in addopts: running a single
        # test file is the commonest local action, and measuring the whole
        # application from one file would report ~8% and fail the threshold
        # every time. The threshold itself is in pyproject.toml, so
        # `pytest --cov=app` locally is the same check this runs.
        run: pytest -q --no-header -rs --cov=app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Dependency audit
        # The whole tree, dev dependencies included: a compromised build tool
        # reaches production just as surely as a compromised runtime one. Gating
        # at `high` while the tree is clean -- loosening a threshold later is
        # easy, tightening one never happens.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        # Thresholds are in vitest.config.mts and are a floor against tests
        # being deleted, not a claim that this is well covered -- see the
        # comment there about why the honest number is 19% and not 86%.
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
